<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Art Courses Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@19.5.6/build/css/intlTelInput.css"/>

<style>
  :root{
    --form-h: 420px;
    --field-bg:#f1f3f3;
    --label:#2b445b;
    --invalid:#fde7e7;
    --hover:#ADE2D7;
    --btn:#233e57;
    --btn-text:#fff;
    --radius:28px;
    --radius-sm:22px;
    --shadow:0 10px 22px rgba(0,0,0,.07);
  }

  @media (max-width:900px){ :root{ --form-h: 680px; } }
  @media (max-width:650px){ :root{ --form-h: 950px; } }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    height:var(--form-h);
  }

  body{
    font-family:"Red Hat Display",ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;
    background:transparent;
    color:#0f1f28;
    overflow:hidden;
  }

  .wrap{
    width:100%;
    padding:22px 0 28px;
    height:var(--form-h);
    overflow:auto;
  }

  form{
    display:grid;
    gap:20px 22px;
    grid-template-columns:repeat(12,1fr);
  }

  .field label{
    display:block;
    font-weight:700;
    color:var(--label);
    font-size:14px;
    margin:0 0 8px;
  }

  .req::after{
    content:" *";
    color:#e05353;
    font-weight:800
  }

  .input, select, textarea{
    width:100%;
    border:none;
    outline:none;
    background:var(--field-bg);
    border-radius:var(--radius);
    padding:12px 20px;
    font-size:16px;
    line-height:1.25;
    font-weight:300;
    transition:box-shadow .15s ease, background .15s ease;
  }

  .input:hover, select:hover, textarea:hover{
    background:var(--hover);
  }

  .input:focus, select:focus, textarea:focus{
    box-shadow:0 0 0 3px rgba(35,184,153,.16);
    background:#eef1f1;
  }

  .invalid{
    background:var(--invalid)!important;
    box-shadow:none!important;
  }

  .phone-shell{
    background:var(--field-bg);
    border-radius:var(--radius);
    padding:8px 12px;
    transition:box-shadow .15s, background .15s;
  }

  .phone-shell:hover{
    background:var(--hover);
  }

  .phone-shell:focus-within{
    box-shadow:0 0 0 3px rgba(35,184,153,.16);
    background:#eef1f1;
  }

  .phone{
    width:100%;
    border:none;
    background:transparent;
    outline:none;
    padding:6px 8px 6px 58px;
    font-size:16px;
    font-weight:300;
  }

  textarea{
    min-height:120px;
    border-radius:var(--radius-sm);
    resize:none;
  }

  /* layout */
  .first { grid-column:span 3; }
  .last  { grid-column:span 3; }
  .age   { grid-column:span 3; }
  .mail  { grid-column:span 3; }

  .phonec{ grid-column:span 4; }
  .branch{ grid-column:span 4; }
  .course{ grid-column:span 4; }

  .msg{
    grid-column:1 / span 6;
  }

  .actions{
    grid-column:7 / span 3;
    display:flex;
    align-items:flex-start;
    padding-top:22px;
  }

  .tailpad{
    grid-column:1 / -1;
    height:1px;
  }

  button[type="submit"]{
    width:100%;
    background:var(--btn);
    color:var(--btn-text);
    border:none;
    padding:12px 20px;
    font-size:16px;
    font-weight:800;
    border-radius:var(--radius);
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .08s ease, opacity .2s ease, background .15s ease;
  }

  button[type="submit"]:hover{
    background:var(--hover);
  }

  button[type="submit"]:active{
    transform:translateY(1px)
  }

  button[disabled]{
    opacity:.6;
    cursor:progress
  }

  .thanks{
    color:var(--label);
    font-size:16px;
    display:none;
    align-self:flex-start;
    margin-left:.5rem;
  }

  select{
    -webkit-appearance:none;
    -moz-appearance:none;
    appearance:none;

    background-image:
      linear-gradient(45deg, transparent 50%, #2b445b 50%),
      linear-gradient(135deg, #2b445b 50%, transparent 50%);

    background-position:
      calc(100% - 26px) calc(0.85em + 4px),
      calc(100% - 20px) calc(0.85em + 4px);

    background-size:6px 6px, 6px 6px;
    background-repeat:no-repeat;
    padding-right:44px;
  }

  @media (max-width:900px){
    .first,.last,.age,.mail{
      grid-column:span 6;
    }

    .phonec,.branch,.course{
      grid-column:span 6;
    }

    .msg{
      grid-column:1 / -1;
    }

    .actions{
      grid-column:1 / -1;
      padding-top:0;
    }
  }

  @media (max-width:650px){
    form{
      gap:16px
    }

    .first,.last,.age,.mail,
    .phonec,.branch,.course,
    .msg,.actions{
      grid-column:1 / -1;
    }
  }
</style>
</head>

<body>

  <div class="wrap">

    <form id="enrollForm" novalidate>

      <!-- Row 1 -->
      <div class="field first">
        <label class="req" id="lbl-first">First name</label>
        <input
          class="input"
          id="firstName"
          name="firstName"
          autocomplete="given-name"
          required
        />
      </div>

      <div class="field last">
        <label class="req" id="lbl-last">Last name</label>
        <input
          class="input"
          id="lastName"
          name="lastName"
          autocomplete="family-name"
          required
        />
      </div>

      <div class="field age">
        <label class="req" id="lbl-age">Age</label>
        <input
          class="input"
          id="age"
          name="age"
          type="text"
          inputmode="numeric"
          required
        />
      </div>

      <div class="field mail">
        <label class="req" id="lbl-email">Email</label>
        <input
          class="input"
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        />
      </div>

      <!-- Row 2 -->
      <div class="field phonec">
        <label class="req" id="lbl-phone">Phone</label>

        <div class="phone-shell" id="phoneShell">
          <input
            id="phone"
            class="phone"
            name="phone"
            type="tel"
            required
          />
        </div>
      </div>

      <div class="field branch">
        <label class="req" id="lbl-branch">Branch</label>
        <select id="branch" name="branch" required></select>
      </div>

      <div class="field course">
        <label class="req" id="lbl-course">Course</label>
        <select id="course" name="course" required></select>
      </div>

      <!-- Row 3 -->
      <div class="field msg">
        <label id="lbl-message">Leave a message</label>
        <textarea id="message" name="message"></textarea>
      </div>

      <div class="actions">
        <button id="submitBtn" type="submit">Submit</button>
        <div id="thanks" class="thanks">
          Thanks, we received your submission.
        </div>
      </div>

      <div class="tailpad"></div>

    </form>

  </div>


  <!-- libs -->
  <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@19.5.6/build/js/intlTelInput.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@19.5.6/build/js/utils.js"></script>


  <!-- Firebase (CDN modules) -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    /* === Firebase config === */

    const firebaseConfig = {
      apiKey: "AIzaSyB-vfjAb9matVnpO6BVc3xBoFHnT_xXfH0",
      authDomain: "levels-registration.firebaseapp.com",
      projectId: "levels-registration",
      storageBucket: "levels-registration.firebasestorage.app",
      messagingSenderId: "883788306190",
      appId: "1:883788306190:web:1da45dc034cca9edefa95f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    /* ===== i18n (EN / KA) — ART ===== */

    const i18n = {

      en: {

        labels: {
          first:'First name',
          last:'Last name',
          age:'Age',
          email:'Email',
          phone:'Phone',
          branch:'Branch',
          course:'Course',
          message:'Leave a message'
        },

        placeholders: {
          branch:'Select a branch',
          course:'Select a course'
        },

        branches: [
          'Vake',
          'Krtsanisi'
        ],

        courses: [
          'Drawing & Painting (Age: 5–8)',
          'Drawing & Painting (Age: 9–12)',
          'Drawing & Painting (Age: 13–18)',
          'Portfolio Creation',
          'Contemporary Visual Arts'
        ],

        button:'Submit',

        thanks:
          'Thanks, we received your submission.'
      },


      ka: {

        labels: {
          first:'სახელი',
          last:'გვარი',
          age:'ასაკი',
          email:'ელ-ფოსტა',
          phone:'ტელეფონი',
          branch:'ფილიალი',
          course:'კურსი',
          message:'დატოვეთ შეტყობინება'
        },

        placeholders: {
          branch:'აირჩიეთ ფილიალი',
          course:'აირჩიეთ კურსი'
        },

        branches: [
          'ვაკე',
          'კრწანისი'
        ],

        courses: [
          'ხატვის კურსი (ასაკი: 5–8)',
          'ხატვის კურსი (ასაკი: 9–12)',
          'ხატვის კურსი (ასაკი: 13–18)',
          'პორტფოლიოს შექმნა',
          'თანამედროვე ვიზუალური ხელოვნება'
        ],

        button:'გაგზავნა',

        thanks:
          'გმადლობთ, თქვენი განაცხადი მივიღეთ.'
      }

    };


    function fillSelect(el, placeholder, options){

      el.innerHTML = '';

      const ph = document.createElement('option');

      ph.value = '';
      ph.disabled = true;
      ph.selected = true;
      ph.textContent = placeholder;

      el.appendChild(ph);

      options.forEach(txt => {

        const op = document.createElement('option');

        op.textContent = txt;
        // value defaults to textContent

        el.appendChild(op);

      });
    }


    function setLanguage(lang){

      const key = i18n[lang] ? lang : 'en';
      const t = i18n[key];

      document.getElementById('lbl-first').textContent =
        t.labels.first;

      document.getElementById('lbl-last').textContent =
        t.labels.last;

      document.getElementById('lbl-age').textContent =
        t.labels.age;

      document.getElementById('lbl-email').textContent =
        t.labels.email;

      document.getElementById('lbl-phone').textContent =
        t.labels.phone;

      document.getElementById('lbl-branch').textContent =
        t.labels.branch;

      document.getElementById('lbl-course').textContent =
        t.labels.course;

      document.getElementById('lbl-message').textContent =
        t.labels.message;


      fillSelect(
        document.getElementById('branch'),
        t.placeholders.branch,
        t.branches
      );

      fillSelect(
        document.getElementById('course'),
        t.placeholders.course,
        t.courses
      );


      document.getElementById('submitBtn').textContent =
        t.button;

      document.getElementById('thanks').textContent =
        t.thanks;

      document.documentElement.setAttribute(
        'lang',
        key
      );
    }


    // Default EN; Wix page will override via postMessage
    setLanguage('en');


    // Accept language from Wix page code

    window.addEventListener('message', (e) => {

      let d = e.data;

      if(typeof d === 'string'){
        try {
          d = JSON.parse(d);
        } catch(_){}
      }

      if(d && d.type === 'set-lang'){
        setLanguage(d.lang);
      }

    });


    /* ----- phone input ----- */

    const iti = window.intlTelInput(
      document.getElementById('phone'),
      {
        initialCountry:"ge",

        utilsScript:
          "https://cdn.jsdelivr.net/npm/intl-tel-input@19.5.6/build/js/utils.js",

        separateDialCode:true,

        preferredCountries:[
          "ge",
          "tr",
          "ae",
          "gb"
        ],
      }
    );


    /* Helpers to normalize branch to a key */

    const toBranchKey = (label) => ({
      'Vake':'vake',
      'ვაკე':'vake',

      'Krtsanisi':'krtsanisi',
      'კრწანისი':'krtsანisi'.replace('ნ','ნ')

    }[label] || '');


    /* ----- validation & Firestore save ----- */

    const required = [
      '#firstName',
      '#lastName',
      '#age',
      '#email',
      '#branch',
      '#course',
      '#phone'
    ];

    const validEmail =
      v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);


    function setInvalid(el,on){

      if(el.id === 'phone'){

        document
          .getElementById('phoneShell')
          .classList
          .toggle('invalid',on);

      } else {

        el.classList.toggle(
          'invalid',
          on
        );

      }
    }


    required.forEach(sel => {

      const el = document.querySelector(sel);

      const clear = () => {

        if(el.id === 'phone'){

          if(iti.isValidNumber()){
            setInvalid(el,false);
          }

        } else if(el.type === 'select-one'){

          if(el.value){
            setInvalid(el,false);
          }

        } else {

          if((el.value || '').trim() !== ''){
            setInvalid(el,false);
          }

        }
      };


      el.addEventListener(
        'input',
        clear
      );

      el.addEventListener(
        'change',
        clear
      );

    });


    const form =
      document.getElementById('enrollForm');

    const btn =
      document.getElementById('submitBtn');

    const thanks =
      document.getElementById('thanks');


    form.addEventListener(
      'submit',
      async (e) => {

        e.preventDefault();

        let bad = false;


        required.forEach(sel => {

          const el =
            document.querySelector(sel);

          let invalid = false;


          if(el.id === 'phone'){

            invalid =
              !iti.isValidNumber();

          }

          else if(el.type === 'select-one'){

            invalid =
              !el.value;

          }

          else if(el.id === 'email'){

            invalid =
              !validEmail(
                el.value.trim()
              );

          }

          else {

            invalid =
              (el.value.trim() === '');

          }


          setInvalid(
            el,
            invalid
          );

          bad =
            bad || invalid;

        });


        const ageEl =
          document.getElementById('age');

        const age =
          ageEl.value.trim();


        if(
          isNaN(Number(age)) ||
          Number(age) < 3 ||
          Number(age) > 99
        ){

          setInvalid(
            ageEl,
            true
          );

          bad = true;

        }


        if(bad) return;


        btn.disabled = true;


        try{

          const branchLabel =
            document.getElementById('branch').value;

          const branchKey =
            toBranchKey(branchLabel);


          const payload = {

            /* canonical fields for the panel */

            formKey:
              "ArtRegistration",

            form:
              "ArtRegistration",

            branchKey,


            /* keep legacy fields for older views */

            formId:
              "ArtRegistration",

            branch:
              branchLabel,


            lang:
              document.documentElement.lang ||
              'en',


            firstName:
              document
                .getElementById('firstName')
                .value
                .trim(),


            lastName:
              document
                .getElementById('lastName')
                .value
                .trim(),


            age:
              Number(age),


            email:
              document
                .getElementById('email')
                .value
                .trim(),


            phoneE164:
              iti.getNumber(),


            phoneCountry:
              iti.getSelectedCountryData()?.iso2 ||
              null,


            course:
              document
                .getElementById('course')
                .value,


            message:
              (
                document
                  .getElementById('message')
                  .value ||
                ''
              ).trim(),


            status:
              "action_required",

            isNew:
              true,

            createdAt:
              serverTimestamp()

          };


          await addDoc(
            collection(
              db,
              "submissions"
            ),
            payload
          );


          // success UI

          btn.style.display = 'none';

          thanks.style.display = 'block';

          form.reset();

          iti.setCountry("ge");


          required.forEach(
            sel =>
              setInvalid(
                document.querySelector(sel),
                false
              )
          );


        } catch(err){

          btn.disabled = false;

          alert(
            "Submission failed. Please try again.\n\n" +
            (err?.message || err)
          );

        }

      }
    );

  </script>

</body>
</html>
